<!DOCTYPE html>
<!--
  /pwa-boot.html — PWA 起動シェル
  ---------------------------------------------------------------------------
  目的:
    PWA をコールドスタートすると、iOS はスプラッシュ画像を「WebView が動き出した
    瞬間」に消してしまう。その後 start_url の HTML が届くまで（ログイン済みの
    トップページは DB クエリが多く数秒かかる）画面は真っ白のままで、ユーザーには
    何の進捗も見えない。t_base.php の #pwa-progress-bar は HTML 到着後にしか
    動けないため、この区間を原理的にカバーできない。

  仕組み:
    manifest.json の start_url をこのファイルにしてある。ここは PHP も DB も
    使わない静的 HTML で、ロゴは data URI としてインライン化してあるため
    追加リクエストゼロで即座に描画できる。描画（1フレーム）を待ってから
    location.replace('/') でトップページへ遷移する。ブラウザは遷移先の描画が
    始まるまで現在の画面を出し続けるので、これまで真っ白だった数秒が
    「ロゴ + プログレスバー」の読み込み画面に置き換わる。

  デザイン意図:
    背景色 #f5f1e8 とロゴは iOS スプラッシュ画像
    (/img/icons/splash/splash-*.png) と同一。スプラッシュ → このシェルの
    切り替わりが視覚的に無変化になり、プログレスバーだけが増えて見える。
    ダークモードには追従しない（スプラッシュ画像が light 固定のため、
    合わせた方がちらつかない）。

  注意:
    - iOS はインストール済み PWA の manifest を読み直さないため、start_url の
      変更が効くのは「ホーム画面に追加し直した端末」と Android。
    - このファイル名は manifest の start_url として端末に焼き付く。リネームすると
      既存インストールが 404 になるので、パスは変更しないこと。
    - .htaccess で他の .html と違い長めにキャッシュさせている（中身はリダイレクト
      するだけなので、多少古くても実害がない）。
-->

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a4d3e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ReadNest">

    .logo {
        width: 132px;
        height: 132px;
        background-color: #1a4d3e;
        -webkit-mask: var(--logo) center / contain no-repeat;
        mask: var(--logo) center / contain no-repeat;
    }

    /* t_base.php の #pwa-progress-bar と同じ見た目（遷移後も連続して見える） */
    .bar {
        position: fixed;
        top: env(safe-area-inset-top);
        left: 0;
        height: 3px;
        width: 0;
        background: linear-gradient(to right, #1a4d3e, #38a182);
        box-shadow: 0 0 8px rgba(56, 161, 130, 0.5);
        animation: boot-loading 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes boot-loading {
        0%   { width: 0%;  }
        40%  { width: 60%; }
        70%  { width: 85%; }
        100% { width: 95%; }
    }

    /* 読み込みが長引いたときだけ、そっと文言を出す */
    .msg, .fallback {
        opacity: 0;
        transition: opacity 0.4s ease;
        font-size: 0.875rem;
        margin: 0;
    }
    .msg { color: #6b7280; }
    .fallback {
        color: #1a4d3e;
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 0.25em;
    }
    .show { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
        .bar { animation: none; width: 40%; }
    }

</head>
<body>
<div class="bar"></div>
<div class="wrap">
    <div class="logo" role="img" aria-label="ReadNest"></div>
    <p class="msg" id="msg" aria-live="polite">読み込んでいます…</p>
    <a class="fallback" id="fallback" href="/">ReadNest を開く</a>
</div>

<noscript>
    <meta http-equiv="refresh" content="0;url=/">
</noscript>

<script>
(function () {
    // start_url に付与されたクエリ・ハッシュ（utm_source=homescreen 等）は引き継ぐ
    var target = '/' + window.location.search + window.location.hash;

    var moved = false;
    function go() {
        if (moved) return;
        moved = true;
        // replace: 戻る操作でこのシェルに戻ってこないようにする
        window.location.replace(target);
    }

    // 「描画されてから遷移」させるのが肝。即座に replace すると 1 フレームも
    // 描画されず、結局これまで通り真っ白のままになる。rAF を 2 回待つことで
    // 最初のフレームが画面に出たことを保証する。
    requestAnimationFrame(function () {
        requestAnimationFrame(go);
    });
    // rAF が動かない環境（バックグラウンド起動など）の保険
    setTimeout(go, 300);

    // 遷移中もこのドキュメントは表示され続けるので、長引く場合だけ案内を出す
    setTimeout(function () {
        document.getElementById('msg').classList.add('show');
    }, 2500);
    setTimeout(function () {
        document.getElementById('fallback').classList.add('show');
    }, 8000);
})();
</script>
</body>
</html>
